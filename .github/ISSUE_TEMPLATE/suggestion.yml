name: Suggest a change
description: Something missing, explained badly, in the wrong order, too long, or deserving its own section. Structure and scope are fair game.
labels: ["suggestion"]
body:
  - type: input
    id: section
    attributes:
      label: Section (if it is about one)
      description: The number and title, e.g. "7.5 Hedging, seeming and hearsay". Leave blank for ideas about the guide as a whole.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change?
      options:
        - Add a topic or section
        - Explain something differently
        - Reorder or restructure
        - Cut or shorten
        - Something else
  - type: textarea
    id: what
    attributes:
      label: What would you add or change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter for a learner?
      description: The guide gives a topic space when Russian does it differently from English. How does this one differ?
