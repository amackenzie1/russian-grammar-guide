<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-label="Twelve motion prefixes, each drawn as an arrow relative to a place">
  <defs>
    <marker id="pfx-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="f-accfill" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <!-- row 1 -->
  <g transform="translate(0,0)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">при-</text><text class="f-en" x="74" y="27">arriving</text>
    <rect class="f-box" x="112" y="56" width="40" height="40" rx="3"/>
    <line class="f-acc f-dash" x1="18" y1="76" x2="52" y2="76"/>
    <line class="f-acc" x1="62" y1="76" x2="104" y2="76" marker-end="url(#pfx-arr)"/>
  </g>
  <g transform="translate(182,0)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">у-</text><text class="f-en" x="40" y="27">leaving, gone</text>
    <rect class="f-box" x="24" y="56" width="40" height="40" rx="3"/>
    <line class="f-acc" x1="72" y1="76" x2="112" y2="76"/>
    <line class="f-acc f-dash" x1="122" y1="76" x2="152" y2="76" marker-end="url(#pfx-arr)"/>
  </g>
  <g transform="translate(364,0)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">в-</text><text class="f-en" x="40" y="27">into</text>
    <rect class="f-box" x="92" y="50" width="56" height="52" rx="3"/>
    <line class="f-acc" x1="24" y1="76" x2="116" y2="76" marker-end="url(#pfx-arr)"/>
  </g>
  <g transform="translate(546,0)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">вы-</text><text class="f-en" x="64" y="27">out of</text>
    <rect class="f-box" x="28" y="50" width="56" height="52" rx="3"/>
    <line class="f-acc" x1="56" y1="76" x2="148" y2="76" marker-end="url(#pfx-arr)"/>
  </g>
  <!-- row 2 -->
  <g transform="translate(0,134)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">под-</text><text class="f-en" x="78" y="27">up to</text>
    <rect class="f-box" x="112" y="56" width="40" height="40" rx="3"/>
    <line class="f-acc" x1="62" y1="76" x2="104" y2="76" marker-end="url(#pfx-arr)"/>
  </g>
  <g transform="translate(182,134)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">от-</text><text class="f-en" x="52" y="27">a step away</text>
    <rect class="f-box" x="24" y="56" width="40" height="40" rx="3"/>
    <line class="f-acc" x1="72" y1="76" x2="114" y2="76" marker-end="url(#pfx-arr)"/>
  </g>
  <g transform="translate(364,134)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">пере-</text><text class="f-en" x="86" y="27">across</text>
    <line class="f-ink" x1="72" y1="44" x2="72" y2="112"/>
    <line class="f-ink" x1="104" y1="44" x2="104" y2="112"/>
    <line class="f-acc" x1="24" y1="78" x2="148" y2="78" marker-end="url(#pfx-arr)"/>
  </g>
  <g transform="translate(546,134)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">про-</text><text class="f-en" x="74" y="27">past, through</text>
    <rect class="f-box" x="68" y="72" width="40" height="40" rx="3"/>
    <line class="f-acc" x1="22" y1="54" x2="150" y2="54" marker-end="url(#pfx-arr)"/>
  </g>
  <!-- row 3 -->
  <g transform="translate(0,268)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">за-</text><text class="f-en" x="50" y="27">dropping in</text>
    <rect class="f-box" x="68" y="42" width="40" height="36" rx="3"/>
    <line class="f-acc f-dash" x1="20" y1="106" x2="156" y2="106"/>
    <path class="f-acc" d="M46 106 Q70 104 84 68" marker-end="url(#pfx-arr)"/>
  </g>
  <g transform="translate(182,268)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">до-</text><text class="f-en" x="60" y="27">as far as</text>
    <line class="f-ink" x1="140" y1="48" x2="140" y2="106" style="stroke-width:3"/>
    <line class="f-acc" x1="24" y1="78" x2="132" y2="78" marker-end="url(#pfx-arr)"/>
  </g>
  <g transform="translate(364,268)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">об-</text><text class="f-en" x="52" y="27">around</text>
    <rect class="f-box" x="72" y="62" width="32" height="32" rx="3"/>
    <path class="f-acc" d="M40 96 C28 40 148 40 136 84 C130 108 84 114 56 106" marker-end="url(#pfx-arr)"/>
  </g>
  <g transform="translate(546,268)">
    <rect class="f-cell" x="2" y="2" width="172" height="124" rx="8"/>
    <text class="f-pre" x="14" y="28">с-</text><text class="f-en" x="40" y="27">down from, off</text>
    <rect class="f-box" x="24" y="66" width="62" height="44" rx="3"/>
    <path class="f-acc" d="M64 56 Q112 58 136 104" marker-end="url(#pfx-arr)"/>
  </g>
</svg>
